[package]
name = "flexconnect-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "flexconnect"
path = "src/main.rs"

[dependencies]
flexconnect-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde_json = "1"
# TLS через системный Schannel: не тянет сборку C-кода
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
