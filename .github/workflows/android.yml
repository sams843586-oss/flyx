name: Android alpha build
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'crates/core/**', 'crates/wasm/**', 'ui/**', 'packaging/core-assets.json', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare shared Rust core
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          CARGO_TARGET_DIR=target cargo build -p flyx-wasm --target wasm32-unknown-unknown --release --locked
          wasm-bindgen target/wasm32-unknown-unknown/release/flyx_wasm.wasm --target web --out-dir ui/wasm
          python3 tools/fetch-cores.py android
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build debug APK
        run: bash android/gradlew -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Flyx-Android-alpha-debug
          path: android/app/build/outputs/apk/debug/*.apk
